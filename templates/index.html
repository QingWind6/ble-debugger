<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLE Debugger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
/* ===== Modern UI Theme System ===== */
:root {
  --font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, 'PingFang SC', sans-serif;
  --transition-speed: 0.2s;
}

[data-theme="dark"] {
  --bg: #0f172a; --surface: #1e293b; --surface2: #334155; --border: #334155;
  --text: #f8fafc; --text2: #94a3b8; --text3: #64748b;
  --accent: #3b82f6; --accent-hover: #2563eb; --accent-dim: rgba(59, 130, 246, 0.15);
  --green: #10b981; --green-dim: rgba(16, 185, 129, 0.15);
  --red: #ef4444; --red-dim: rgba(239, 68, 68, 0.15);
  --yellow: #f59e0b; --yellow-dim: rgba(245, 158, 11, 0.15);
  --orange: #f97316; --orange-dim: rgba(249, 115, 22, 0.15);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
  --scrollbar-thumb: #475569;
}

[data-theme="eyecare"] {
  --bg: #fdfbf7; --surface: #f3f0e8; --surface2: #e8e4db; --border: #dfdbd1;
  --text: #334155; --text2: #64748b; --text3: #94a3b8;
  --accent: #0284c7; --accent-hover: #0369a1; --accent-dim: rgba(2, 132, 199, 0.1);
  --green: #059669; --green-dim: rgba(5, 150, 105, 0.1);
  --red: #dc2626; --red-dim: rgba(220, 38, 38, 0.1);
  --yellow: #d97706; --yellow-dim: rgba(217, 119, 6, 0.1);
  --orange: #ea580c; --orange-dim: rgba(234, 88, 12, 0.1);
  --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  --scrollbar-thumb: #cbd5e1;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-family);
  font-size: 14px; transition: background var(--transition-speed), color var(--transition-speed);
  overflow: hidden;
}

/* ===== Top bar ===== */
.topbar {
  height: 52px; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; flex-shrink: 0; z-index: 10;
}
.topbar-brand {
  display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px;
  color: var(--accent); letter-spacing: -0.2px;
}
.topbar-actions { display: flex; align-items: center; gap: 12px; }

.toggle-group {
  display: flex; background: var(--surface2); border-radius: 8px; overflow: hidden; padding: 2px;
}
.toggle-group button {
  border: none; border-radius: 6px; padding: 6px 14px; font-size: 12px;
  background: transparent; color: var(--text2); cursor: pointer;
  transition: all var(--transition-speed); font-weight: 600;
}
.toggle-group button.active { background: var(--accent); color: #fff; box-shadow: var(--shadow); }
.toggle-group button:not(.active):hover { color: var(--text); }

/* ===== Layout ===== */
.app-layout { display: flex; height: calc(100vh - 52px); }
.panel { display: flex; flex-direction: column; border-right: 1px solid var(--border); transition: background var(--transition-speed); }
.panel-scan { width: 340px; min-width: 300px; background: var(--bg); }
.panel-services { width: 380px; min-width: 320px; flex-shrink: 0; background: var(--surface); }
.panel-data { flex: 1; min-width: 450px; background: var(--bg); }
.panel-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;
}
.panel-header h2 { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: 0.2px; }
.panel-body { flex: 1; overflow-y: auto; padding: 12px; }

/* ===== Buttons ===== */
button {
  background: var(--surface2); color: var(--text); border: 1px solid transparent;
  padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px;
  transition: all var(--transition-speed); font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
button:hover { filter: brightness(1.1); box-shadow: var(--shadow); }
button:active { transform: translateY(1px); }
button.primary { background: var(--accent); color: #fff; box-shadow: var(--shadow); }
button.primary:hover { background: var(--accent-hover); }
button.danger { background: var(--red-dim); color: var(--red); border: 1px solid transparent; }
button.danger:hover { background: var(--red); color: #fff; }
button.sm { padding: 5px 12px; font-size: 12px; border-radius: 6px; }
button:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

input, select, textarea {
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  padding: 10px 14px; border-radius: 8px; font-size: 13px; font-family: inherit;
  width: 100%; transition: all var(--transition-speed);
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }

	/* ===== Device list ===== */
	.device-item {
	  padding: 12px 14px; border-radius: 12px; cursor: pointer; margin-bottom: 8px;
	  transition: all var(--transition-speed); display: flex; flex-direction: column; gap: 10px;
	  border: 1px solid var(--border); background: var(--surface);
	}
	.device-item:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: var(--accent-dim); }
	.device-item.selected { background: var(--accent-dim); border-color: var(--accent); }
	.device-summary { display: flex; align-items: center; gap: 12px; width: 100%; }
	.device-rssi {
	  font-size: 12px; font-weight: 700; width: 48px; text-align: center;
	  padding: 4px 0; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.rssi-strong { color: var(--green); background: var(--green-dim); }
.rssi-medium { color: var(--yellow); background: var(--yellow-dim); }
.rssi-weak { color: var(--red); background: var(--red-dim); }
	.device-info { flex: 1; overflow: hidden; }
	.device-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.device-addr { font-size: 11px; color: var(--text2); font-family: 'SF Mono', monospace; margin-top: 4px; }
	.device-expand {
	  width: 32px; height: 32px; padding: 0; border-radius: 8px; flex-shrink: 0;
	  background: var(--surface2); color: var(--text2);
	}
	.device-expand:hover { color: var(--text); border-color: var(--border); }
	.device-expand svg { transition: transform var(--transition-speed); }
	.device-expand.open svg { transform: rotate(90deg); }
	.adv-detail {
	  width: 100%; cursor: default; border-top: 1px solid var(--border); padding-top: 10px;
	  display: flex; flex-direction: column; gap: 8px;
	}
	.adv-detail-title { font-size: 12px; font-weight: 700; color: var(--text); display: flex; align-items: center; justify-content: space-between; }
	.adv-grid { display: grid; grid-template-columns: minmax(72px, auto) 1fr; gap: 6px 10px; font-size: 11px; }
	.adv-key { color: var(--text3); }
	.adv-value { color: var(--text); font-family: 'SF Mono', monospace; word-break: break-all; min-width: 0; }
	.adv-section { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
	.adv-section-title { font-size: 11px; color: var(--text2); font-weight: 700; margin-bottom: 6px; }
	.adv-code { font-family: 'SF Mono', monospace; color: var(--text); word-break: break-all; line-height: 1.5; }
	.adv-pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
	.adv-pill { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--surface2); color: var(--text2); }
	.adv-pill.on { background: var(--green-dim); color: var(--green); }
	.adv-pill.warn { background: var(--yellow-dim); color: var(--yellow); }

/* ===== Connection status ===== */
.conn-status {
  display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600;
  padding: 12px 16px; background: var(--bg); border-radius: 12px; margin-bottom: 16px;
  border: 1px solid var(--border);
}
.conn-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.conn-dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
.conn-dot.off { background: var(--text3); }
.conn-dot.loading {
  background: transparent; border: 2px solid var(--accent-dim); border-top-color: var(--accent);
  animation: spin 1s linear infinite; box-shadow: none;
}

/* ===== Services tree ===== */
.service-group { margin-bottom: 8px; }
.service-header {
  padding: 10px 14px; background: var(--surface2); border-radius: 8px;
  font-size: 12px; font-weight: 700; color: var(--text); font-family: 'SF Mono', monospace;
  cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between;
  border: 1px solid transparent; transition: all var(--transition-speed);
}
.service-header:hover { border-color: var(--border); filter: brightness(1.05); }
.service-header .svc-count { font-size: 11px; color: var(--text2); font-family: var(--font-family); font-weight: 500; }
.service-chars { padding: 4px 0 4px 8px; }
.char-item {
  padding: 10px 12px; margin: 4px 0; border-radius: 8px; cursor: pointer;
  transition: all var(--transition-speed); font-size: 12px;
  border-left: 3px solid transparent; background: transparent;
}
.char-item:hover { background: var(--surface2); }
.char-item.selected { background: var(--accent-dim); border-left-color: var(--accent); }
.char-uuid { font-family: 'SF Mono', monospace; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.char-props { display: flex; gap: 6px; flex-wrap: wrap; }
.prop-tag {
  font-size: 10px; padding: 2px 8px; border-radius: 6px; font-weight: 700; text-transform: uppercase;
}
.prop-tag.read { color: var(--green); background: var(--green-dim); }
.prop-tag.write { color: var(--accent); background: var(--accent-dim); }
.prop-tag.write-without-response { color: var(--orange); background: var(--orange-dim); }
.prop-tag.notify { color: var(--yellow); background: var(--yellow-dim); }

/* ===== Data panel ===== */
.data-section { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); padding: 16px; margin-bottom: 16px; display: flex; flex-direction: column; }
.data-section h3 { font-size: 13px; color: var(--text); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

.char-detail-header { margin-bottom: 16px; }
.char-detail-uuid { font-family: 'SF Mono', monospace; font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 10px; }
.action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

.write-area textarea { height: 80px; font-family: 'SF Mono', monospace; resize: vertical; margin-bottom: 12px; }

/* ===== Log ===== */
.log-container {
  flex: 1; overflow-y: auto; font-family: 'SF Mono', monospace; font-size: 12px;
  background: var(--bg); border-radius: 8px; padding: 10px; border: 1px inset var(--border);
  min-height: 250px;
}
.log-entry {
  padding: 6px 8px; border-bottom: 1px solid var(--border); display: flex; gap: 10px;
  border-radius: 4px; transition: background 0.1s;
}
.log-entry:hover { background: var(--surface2); }
.log-entry:last-child { border-bottom: none; }
.log-time { color: var(--text3); flex-shrink: 0; }
.log-dir { font-weight: 700; width: 28px; flex-shrink: 0; }
.log-dir.rx { color: var(--green); }
.log-dir.tx { color: var(--accent); }
.log-dir.notify { color: var(--yellow); }
.log-uuid { color: var(--text2); max-width: 100px; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
.log-data { color: var(--text); word-break: break-all; flex: 1; }
.log-text { color: var(--text2); font-style: italic; margin-left: 8px; }

.frame-container {
  overflow-y: auto; font-family: 'SF Mono', monospace; font-size: 12px;
  background: var(--bg); border-radius: 8px; padding: 10px; border: 1px inset var(--border);
  max-height: 250px; min-height: 120px;
}
.frame-card { background: var(--surface2); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
.frame-card:last-child { margin-bottom: 0; }
.frame-meta { display: flex; gap: 8px; color: var(--text3); font-size: 11px; margin-bottom: 8px; align-items: center; }
.frame-badge { padding: 2px 8px; border-radius: 12px; font-weight: 700; background: var(--green-dim); color: var(--green); }
.frame-body { white-space: pre-wrap; word-break: break-word; color: var(--text); line-height: 1.5; font-size: 13px; }

/* ===== Utils ===== */
.empty-state { color: var(--text3); text-align: center; padding: 40px 20px; font-size: 13px; font-weight: 500; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Enhanced Toast ===== */
.toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
.toast {
  padding: 14px 20px; border-radius: 12px; font-size: 13px; font-weight: 600;
  color: #fff; background: var(--surface2); box-shadow: var(--shadow-lg);
  animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards, fadeOut 0.3s ease 3.7s forwards;
  max-width: 350px; word-break: break-word; display: flex; align-items: center; gap: 10px;
}
.toast.error { background: var(--red); }
.toast.success { background: var(--green); }
.toast.info { background: var(--accent); }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px) scale(0.95); } to { opacity: 1; transform: none; } }
@keyframes fadeOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(10px) scale(0.95); } }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--text3); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 6.5l11 11M6.5 17.5l11-11M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
    </svg>
    <span>BLE Debugger</span>
  </div>
  <div class="topbar-actions">
    <div class="toggle-group" id="langToggle">
      <button class="active" onclick="setLang('zh')">中文</button>
      <button onclick="setLang('en')">EN</button>
    </div>
    <div class="toggle-group" id="themeToggle">
      <button class="active" onclick="setTheme('dark')">
        <span id="themeDarkLabel">深色</span>
      </button>
      <button onclick="setTheme('eyecare')">
        <span id="themeEyecareLabel">护眼</span>
      </button>
    </div>
  </div>
</div>

<div class="app-layout">
  <div class="panel panel-scan">
    <div class="panel-header">
      <h2><span data-i18n="devices">设备</span> <span id="deviceCount" style="color:var(--text3); font-weight: 500"></span></h2>
      <button id="btnScan" class="primary sm" onclick="toggleScan()" data-i18n="startScan">开始扫描</button>
    </div>
    <div class="panel-body" id="deviceList">
      <div class="empty-state" data-i18n="emptyScan">点击「开始扫描」发现附近设备</div>
    </div>
  </div>

  <div class="panel panel-services">
    <div class="panel-header">
      <h2 data-i18n="services">服务列表</h2>
      <button id="btnDisconnect" class="danger sm" onclick="disconnectDevice()" style="display:none" data-i18n="disconnect">断开连接</button>
    </div>
    <div class="panel-body">
      <div id="connStatus" class="conn-status" style="display:none">
        <div class="conn-dot" id="connDot"></div>
        <span id="connLabel" data-i18n="disconnected">未连接</span>
      </div>
      <div id="serviceList">
        <div class="empty-state" data-i18n="emptyService">请先连接左侧设备</div>
      </div>
    </div>
  </div>

  <div class="panel panel-data">
    <div class="panel-header">
      <h2 data-i18n="data">通信数据</h2>
      <button class="sm" onclick="clearAllData()" data-i18n="clearLog">清空视图</button>
    </div>
    <div class="panel-body" style="display:flex; flex-direction:column; padding: 20px;">

      <div id="charDetail" class="data-section" style="display:none">
        <div class="char-detail-header">
          <div class="char-detail-uuid" id="detailUuid"></div>
          <div class="char-props" id="detailProps"></div>
          <div class="action-row" id="actionRow"></div>
        </div>

        <div class="write-area" id="writeArea" style="display:none">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
            <h3 data-i18n="writeData" style="margin:0">写入数据</h3>
            <div style="display:flex; gap:8px">
               <select id="writeType" class="sm" style="width:120px; padding: 4px 8px;">
                 <option value="with_response" data-i18n="writeWithResp">有响应 (Req)</option>
                 <option value="without_response" data-i18n="writeNoResp">无响应 (Cmd)</option>
               </select>
               <div class="toggle-group" style="padding:0">
                 <button id="fmtHex" class="active" onclick="setFormat('hex')">HEX</button>
                 <button id="fmtText" onclick="setFormat('text')">TEXT</button>
               </div>
            </div>
          </div>
          <textarea id="writeInput" data-i18n-placeholder="hexPlaceholder" placeholder="输入十六进制..."></textarea>
          <div style="display:flex; gap:12px; align-items:center">
            <button class="primary" onclick="writeData()" data-i18n="send" style="width:100px">发送</button>
            <span id="writeHint" style="font-size:12px; color:var(--text3)"></span>
          </div>
        </div>
      </div>

      <div class="data-section" style="flex:1">
        <h3><span data-i18n="commLog">实时日志</span></h3>
        <div class="log-container" id="logContainer">
          <div class="empty-state" data-i18n="emptyLog">暂无通信数据</div>
        </div>
      </div>

      <div class="data-section">
        <h3><span data-i18n="completeFrames">重组帧</span></h3>
        <div class="frame-container" id="frameContainer">
          <div class="empty-state" data-i18n="emptyFrames">暂无重组报文</div>
        </div>
      </div>

    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script>
// ===== i18n =====
const I18N = {
  zh: {
    devices: '设备', startScan: '开始扫描', stopScan: '停止扫描',
    emptyScan: '点击「开始扫描」发现附近设备', noDevices: '未发现设备',
    services: '服务列表', disconnect: '断开连接', disconnected: '未连接',
    emptyService: '请先连接左侧设备', connecting: '正在建立连接',
    connected: '已连接', data: '通信数据', clearLog: '清空视图', writeData: '写入数据',
    writeWithResp: '有响应 (Req)', writeNoResp: '无响应 (Cmd)',
    hexPlaceholder: '输入十六进制字节 (如 48 65 6C 6C 6F)...',
    textPlaceholder: '输入文本 (如 Hello)...', send: '发送 (Enter)',
    commLog: '实时日志', emptyLog: '暂无通信数据',
	    completeFrames: '重组帧', emptyFrames: '暂无重组报文',
	    read: '读取', startNotify: '开启通知', stopNotify: '停止通知',
	    readDesc: '读描述符', noServices: '未发现服务', chars: '特征值',
	    themeDark: '深色', themeEyecare: '护眼', invalidHex: '无效的十六进制格式',
	    bytes: '字节', showHex: '查看 HEX',
	    advDetails: '广播信息', hideAdv: '收起广播信息', showAdv: '查看广播信息',
	    advLocalName: '本地名称', advConnectable: '可连接', advTxPower: '发射功率',
	    advServiceUuids: '服务 UUID', advServiceData: 'Service Data',
	    advManufacturerData: 'Manufacturer Data', advNone: '无', advYes: '是', advNo: '否',
	    advRawData: 'Raw AD Structures', advPrimaryPayload: 'Advertising Data',
	    advScanRspPayload: 'Scan Response Data', advReconstructed: '由解析字段反组',
	  },
  en: {
    devices: 'Devices', startScan: 'Start Scan', stopScan: 'Stop Scan',
    emptyScan: 'Click "Start Scan" to discover devices', noDevices: 'No devices found',
    services: 'Services', disconnect: 'Disconnect', disconnected: 'Disconnected',
    emptyService: 'Connect to a device first', connecting: 'Connecting',
    connected: 'Connected', data: 'Data Workspace', clearLog: 'Clear All', writeData: 'Write',
    writeWithResp: 'With Resp (Req)', writeNoResp: 'No Resp (Cmd)',
    hexPlaceholder: 'Enter hex bytes (e.g. 48 65 6C 6C 6F)...',
    textPlaceholder: 'Enter text (e.g. Hello)...', send: 'Send (Enter)',
    commLog: 'Live Log', emptyLog: 'No traffic yet',
	    completeFrames: 'Reassembled Frames', emptyFrames: 'No frames yet',
	    read: 'Read', startNotify: 'Notify On', stopNotify: 'Notify Off',
	    readDesc: 'Read Desc', noServices: 'No services found', chars: 'chars',
	    themeDark: 'Dark', themeEyecare: 'Eyecare', invalidHex: 'Invalid hex format',
	    bytes: 'bytes', showHex: 'View HEX',
		    advDetails: 'Advertisement', hideAdv: 'Hide advertisement', showAdv: 'Show advertisement',
		    advLocalName: 'Local name', advConnectable: 'Connectable', advTxPower: 'TX power',
		    advServiceUuids: 'Service UUIDs', advServiceData: 'Service Data',
		    advManufacturerData: 'Manufacturer Data', advNone: 'None', advYes: 'Yes', advNo: 'No',
		    advRawData: 'Raw AD Structures', advPrimaryPayload: 'Advertising Data',
		    advScanRspPayload: 'Scan Response Data', advReconstructed: 'reconstructed from parsed fields',
	  }
	};

let currentLang = localStorage.getItem('ble-lang') || 'zh';
let currentTheme = localStorage.getItem('ble-theme') || 'dark';

function t(key) { return I18N[currentLang][key] || key; }

function setLang(lang) {
  currentLang = lang; localStorage.setItem('ble-lang', lang);
  const btns = document.querySelectorAll('#langToggle button');
  btns[0].className = lang === 'zh' ? 'active' : ''; btns[1].className = lang === 'en' ? 'active' : '';
  applyI18n();
  if (services.length) renderServices(services);
  if (selectedChar) renderActions();
  renderLog(); renderFrames();
  document.getElementById('btnScan').textContent = isScanning ? t('stopScan') : t('startScan');
  document.getElementById('themeDarkLabel').textContent = t('themeDark');
  document.getElementById('themeEyecareLabel').textContent = t('themeEyecare');
  if (lastDevices) renderDevices(lastDevices);
  const opts = document.getElementById('writeType').options;
  opts[0].textContent = t('writeWithResp'); opts[1].textContent = t('writeNoResp');
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = I18N[currentLang][el.getAttribute('data-i18n')]; });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = I18N[currentLang][el.getAttribute('data-i18n-placeholder')]; });
}

function setTheme(theme) {
  currentTheme = theme; localStorage.setItem('ble-theme', theme);
  document.documentElement.setAttribute('data-theme', theme);
  const btns = document.querySelectorAll('#themeToggle button');
  btns[0].className = theme === 'dark' ? 'active' : ''; btns[1].className = theme === 'eyecare' ? 'active' : '';
}

document.documentElement.setAttribute('data-theme', currentTheme);

// ===== Socket & State =====
const socket = io();
let isScanning = false;
let selectedDevice = null;
let selectedChar = null;
let writeFormat = 'hex';
let notifyEnabled = {};
let services = [];
	let lastDevices = null;
	let expandedDevices = new Set();
	let assembledEntries = [];
let logEntries = [];

socket.on('scan_results', (data) => { lastDevices = data.devices; renderDevices(data.devices); });

socket.on('scan_status', (data) => {
  isScanning = data.scanning;
  const btn = document.getElementById('btnScan');
  btn.textContent = isScanning ? t('stopScan') : t('startScan');
  btn.className = isScanning ? 'danger sm' : 'primary sm';
  if(!isScanning && !lastDevices) document.getElementById('deviceList').innerHTML = `<div class="empty-state">${t('emptyScan')}</div>`;
});

socket.on('connected', (data) => {
  services = data.services;
  document.getElementById('connDot').className = 'conn-dot on';
  document.getElementById('connLabel').textContent = t('connected') + ': ' + data.address;
  document.getElementById('btnDisconnect').style.display = '';
  renderServices(data.services);
  showToast(t('connected'), 'success');
});

socket.on('disconnected', () => {
  document.getElementById('connDot').className = 'conn-dot off';
  document.getElementById('connLabel').textContent = t('disconnected');
  document.getElementById('btnDisconnect').style.display = 'none';
  document.getElementById('serviceList').innerHTML = `<div class="empty-state">${t('emptyService')}</div>`;
  document.getElementById('charDetail').style.display = 'none';
  notifyEnabled = {}; selectedChar = null; services = []; assembledEntries = [];
  renderFrames();
});

socket.on('char_value', (data) => { addLog('RX', data.uuid, data.value, data.timestamp); });
socket.on('write_ok', (data) => { addLog('TX', data.uuid, data.value, data.timestamp); });
socket.on('notification', (data) => { addLog('NOTIFY', data.uuid, data.value, data.timestamp); });
socket.on('notification_frame', (data) => { addAssembledFrame(data.uuid, data.value, data.timestamp); });

socket.on('notify_status', (data) => {
  notifyEnabled[data.uuid] = data.enabled;
  if (selectedChar && selectedChar === data.uuid) renderActions();
  showToast(data.enabled ? t('startNotify') + ' OK' : t('stopNotify') + ' OK', 'info');
});

socket.on('descriptor_value', (data) => { addLog('RX', `desc:${data.handle}`, data.value, new Date().toTimeString().slice(0,8)); });

// Error handling fix
socket.on('error', (data) => {
  showToast(data.message, 'error');
  // If connection failed while UI was spinning, the backend emitted "disconnected" properly now, but we double check
  if (data.type === 'connect' || document.getElementById('connLabel').textContent.includes(t('connecting'))) {
      document.getElementById('connDot').className = 'conn-dot off';
      document.getElementById('connLabel').textContent = t('disconnected');
  }
});

function toggleScan() { socket.emit(isScanning ? 'stop_scan' : 'start_scan'); }

	function renderDevices(devices) {
	  const el = document.getElementById('deviceList');
	  document.getElementById('deviceCount').textContent = `(${devices.length})`;
	  if (!devices.length) { el.innerHTML = `<div class="empty-state">${t('noDevices')}</div>`; return; }
	  el.innerHTML = devices.map(d => {
	    const rssiClass = d.rssi > -60 ? 'rssi-strong' : d.rssi > -80 ? 'rssi-medium' : 'rssi-weak';
	    const addressJson = JSON.stringify(d.address);
	    const expanded = expandedDevices.has(d.address);
	    return `<div class="device-item ${selectedDevice === d.address ? 'selected' : ''}" onclick='connectDevice(${addressJson})'>
	      <div class="device-summary">
	        <div class="device-rssi ${rssiClass}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0114.08 0M1.42 9a16 16 0 0121.16 0M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg>${d.rssi}</div>
	        <div class="device-info">
	          <div class="device-name">${escHtml(d.name)}</div>
	          <div class="device-addr">${escHtml(d.address)}</div>
	        </div>
	        <button class="device-expand ${expanded ? 'open' : ''}" type="button" aria-label="${expanded ? t('hideAdv') : t('showAdv')}" title="${expanded ? t('hideAdv') : t('showAdv')}" onclick='toggleAdvDetails(event, ${addressJson})'>
	          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
	        </button>
	      </div>
	      ${expanded ? renderAdvertisementDetails(d) : ''}
	    </div>`;
	  }).join('');
	}

	function toggleAdvDetails(event, address) {
	  event.stopPropagation();
	  if (expandedDevices.has(address)) expandedDevices.delete(address);
	  else expandedDevices.add(address);
	  renderDevices(lastDevices || []);
	}

	function renderAdvertisementDetails(device) {
	  const adv = device.advertisement || {};
	  const connectable = adv.connectable === null || adv.connectable === undefined
	    ? t('advNone')
	    : (adv.connectable ? t('advYes') : t('advNo'));
	  const txPower = adv.tx_power === null || adv.tx_power === undefined ? t('advNone') : `${adv.tx_power} dBm`;
	  const serviceUuids = (adv.service_uuids || []).length
	    ? `<div class="adv-code">${adv.service_uuids.map(escHtml).join('<br>')}</div>`
	    : `<span class="adv-value">${t('advNone')}</span>`;
	  const rawData = renderRawAdvertisementData(adv.raw || {});
	  const serviceData = renderServiceData(adv.service_data || []);
	  const manufacturerData = renderManufacturerData(adv.manufacturer_data || []);
	  return `<div class="adv-detail" onclick="event.stopPropagation()">
	    <div class="adv-detail-title"><span>${t('advDetails')}</span></div>
	    <div class="adv-grid">
	      <div class="adv-key">${t('advLocalName')}</div><div class="adv-value">${escHtml(adv.local_name || t('advNone'))}</div>
	      <div class="adv-key">${t('advConnectable')}</div><div class="adv-value">${connectable}</div>
	      <div class="adv-key">${t('advTxPower')}</div><div class="adv-value">${txPower}</div>
	      <div class="adv-key">${t('advServiceUuids')}</div><div>${serviceUuids}</div>
		    </div>
		    ${rawData}
		    ${serviceData}
		    ${manufacturerData}
		  </div>`;
	}

	function renderServiceData(items) {
	  if (!items.length) return `<div class="adv-section"><div class="adv-section-title">${t('advServiceData')}</div><div class="adv-value">${t('advNone')}</div></div>`;
	  return `<div class="adv-section"><div class="adv-section-title">${t('advServiceData')}</div>${items.map(item => `
	    <div style="margin-bottom:8px">
	      <div class="adv-value">${escHtml(item.uuid)}</div>
	      <div class="adv-code">${formatHex(item.value_hex || '')}</div>
	      ${item.value_text ? `<div class="adv-value">"${escHtml(item.value_text)}"</div>` : ''}
	    </div>`).join('')}</div>`;
	}

	function renderRawAdvertisementData(raw) {
	  const advHex = raw.advertising_data_hex || '';
	  const scanRspHex = raw.scan_response_hex || '';
	  if (!advHex && !scanRspHex) return '';
	  const note = raw.reconstructed ? `<span class="adv-pill warn">${t('advReconstructed')}</span>` : '';
	  return `<div class="adv-section">
	    <div class="adv-section-title">${t('advRawData')}</div>
	    <div style="margin-bottom:8px">
	      <div class="adv-value">${t('advPrimaryPayload')} (${raw.advertising_data_len || 0}/31)</div>
	      <div class="adv-code">${formatHex(advHex)}</div>
	    </div>
	    <div>
	      <div class="adv-value">${t('advScanRspPayload')} (${raw.scan_response_len || 0}/31)</div>
	      <div class="adv-code">${formatHex(scanRspHex)}</div>
	    </div>
	    ${note ? `<div class="adv-pill-row" style="margin-top:6px">${note}</div>` : ''}
	  </div>`;
	}

	function renderManufacturerData(items) {
	  if (!items.length) return `<div class="adv-section"><div class="adv-section-title">${t('advManufacturerData')}</div><div class="adv-value">${t('advNone')}</div></div>`;
	  return `<div class="adv-section"><div class="adv-section-title">${t('advManufacturerData')}</div>${items.map(item => `
	    <div style="margin-bottom:8px">
	      <div class="adv-value">${escHtml(item.company_id_hex)} (${item.company_id})</div>
	      <div class="adv-code">${formatHex(item.value_hex || '')}</div>
	      ${item.value_text ? `<div class="adv-value">"${escHtml(item.value_text)}"</div>` : ''}
	    </div>`).join('')}</div>`;
	}

function connectDevice(address) {
  selectedDevice = address; renderDevices(lastDevices || []);
  document.getElementById('serviceList').innerHTML = `<div class="empty-state" style="opacity:0.6">${t('connecting')}...</div>`;
  document.getElementById('connStatus').style.display = '';
  document.getElementById('connDot').className = 'conn-dot loading'; // Spinner UI
  document.getElementById('connLabel').textContent = t('connecting') + ' ' + address;
  document.getElementById('btnDisconnect').style.display = 'none';
  socket.emit('connect_device', { address });
}

function disconnectDevice() { socket.emit('disconnect_device'); }

function renderServices(svcs) {
  const el = document.getElementById('serviceList');
  if (!svcs.length) { el.innerHTML = `<div class="empty-state">${t('noServices')}</div>`; return; }
  el.innerHTML = svcs.map(svc => {
    const chars = svc.characteristics.map(ch => `
      <div class="char-item ${selectedChar === ch.uuid ? 'selected' : ''}" onclick="selectChar('${ch.uuid}')">
        <div class="char-uuid">${shortName(ch.uuid)}</div>
        <div class="char-props">${ch.properties.map(p => `<span class="prop-tag ${p}">${p.replace(/write-without-response/g,'NO-RES')}</span>`).join('')}</div>
      </div>`).join('');
    return `<div class="service-group">
      <div class="service-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'block'">
        <span>${shortName(svc.uuid)}</span><span class="svc-count">${svc.characteristics.length} ${t('chars')}</span>
      </div>
      <div class="service-chars">${chars}</div>
    </div>`;
  }).join('');
}

function selectChar(uuid) {
  selectedChar = uuid; renderServices(services);
  document.getElementById('charDetail').style.display = '';
  document.getElementById('detailUuid').textContent = uuid;
  const char = findChar(uuid); if (!char) return;
  document.getElementById('detailProps').innerHTML = char.properties.map(p => `<span class="prop-tag ${p}">${p}</span>`).join('');
  renderActions();
  document.getElementById('writeArea').style.display = char.properties.some(p => p.includes('write')) ? 'block' : 'none';
}

function renderActions() {
  const char = findChar(selectedChar); if (!char) return;
  const row = document.getElementById('actionRow'); let btns = '';
  if (char.properties.includes('read')) btns += `<button class="sm" onclick="socket.emit('read_char', {uuid:'${char.uuid}'})">${t('read')}</button>`;
  if (char.properties.some(p => ['notify','indicate'].includes(p))) {
    const en = notifyEnabled[char.uuid];
    btns += `<button class="sm ${en?'danger':'primary'}" onclick="socket.emit('toggle_notify', {uuid:'${char.uuid}', enable:${!en}})">${en ? t('stopNotify') : t('startNotify')}</button>`;
  }
  char.descriptors?.forEach(d => { btns += `<button class="sm" onclick="socket.emit('read_descriptor', {handle:${d.handle}})">${t('readDesc')}</button>`; });
  row.innerHTML = btns;
}

function findChar(u) { return services.flatMap(s => s.characteristics).find(c => c.uuid === u); }

function writeData() {
  if (!selectedChar) return;
  const raw = document.getElementById('writeInput').value; if (!raw.trim()) return;
  let hex;
  if (writeFormat === 'hex') {
    hex = raw.trim().replace(/\s+/g, '').replace(/0x/gi, '');
    if (!/^[0-9a-fA-F]*$/.test(hex) || hex.length % 2 !== 0) return showToast(t('invalidHex'), 'error');
  } else {
    hex = Array.from(new TextEncoder().encode(raw)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  socket.emit('write_char', { uuid: selectedChar, value: hex, type: document.getElementById('writeType').value });
}

function setFormat(fmt) {
  const inputEl = document.getElementById('writeInput'); const val = inputEl.value;
  if (fmt === writeFormat) return;
  if (val) {
    if (writeFormat === 'hex' && fmt === 'text') {
      const hex = val.replace(/\s+/g, ''); if (/^[0-9a-f]*$/i.test(hex) && hex.length % 2 === 0) inputEl.value = hexToText(hex);
    } else if (writeFormat === 'text' && fmt === 'hex') {
      inputEl.value = Array.from(new TextEncoder().encode(val)).map(b => b.toString(16).padStart(2, '0')).join(' ');
    }
  }
  writeFormat = fmt;
  document.getElementById('fmtHex').className = fmt === 'hex' ? 'active' : '';
  document.getElementById('fmtText').className = fmt === 'text' ? 'active' : '';
  inputEl.placeholder = fmt === 'hex' ? t('hexPlaceholder') : t('textPlaceholder'); updateWriteHint();
}

function updateWriteHint() {
  const raw = document.getElementById('writeInput').value, hint = document.getElementById('writeHint');
  if (!raw.trim()) { hint.textContent = ''; return; }
  if (writeFormat === 'hex') {
    const hex = raw.replace(/\s+/g, '');
    if (/^[0-9a-f]*$/i.test(hex) && hex.length % 2 === 0) hint.innerHTML = `Text: <b style="color:var(--text)">${escHtml(hexToText(hex))}</b> (${hex.length/2} bytes)`;
    else { hint.textContent = t('invalidHex'); hint.style.color = 'var(--red)'; return; }
  } else {
    const b = new TextEncoder().encode(raw);
    hint.innerHTML = `Hex: <b style="color:var(--text)">${Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join(' ')}</b> (${b.length} bytes)`;
  }
  hint.style.color = 'var(--text3)';
}

document.getElementById('writeInput')?.addEventListener('input', updateWriteHint);
document.getElementById('writeInput')?.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); writeData(); } });

function addLog(dir, u, h, ts) {
  const txt = hexToText(h);
  logEntries.push({ dir, u, h, txt, p: isPrintable(txt), ts });
  if(logEntries.length > 200) logEntries.shift();
  renderLog();
}

function renderLog() {
  const el = document.getElementById('logContainer');
  if (!logEntries.length) { el.innerHTML = `<div class="empty-state">${t('emptyLog')}</div>`; return; }
  el.innerHTML = logEntries.map(e => `
    <div class="log-entry">
      <span class="log-time">${e.ts}</span>
      <span class="log-dir ${e.dir.toLowerCase()}">${e.dir === 'NOTIFY' ? 'NF' : e.dir}</span>
      <span class="log-uuid" title="${e.u}">${shortName(e.u)}</span>
      <span class="log-data">${formatHex(e.h)}${e.p ? `<span class="log-text">"${escHtml(e.txt)}"</span>` : ''}</span>
    </div>`).join('');
  el.scrollTop = el.scrollHeight;
}

function addAssembledFrame(u, h, ts) {
  const txt = hexToText(h);
  assembledEntries.unshift({ u, h, txt, p: isPrintable(txt), ts, b: h.length / 2 });
  if (assembledEntries.length > 50) assembledEntries.pop();
  renderFrames();
}

function renderFrames() {
  const el = document.getElementById('frameContainer');
  if (!assembledEntries.length) { el.innerHTML = `<div class="empty-state">${t('emptyFrames')}</div>`; return; }
  el.innerHTML = assembledEntries.map(e => `
    <div class="frame-card">
      <div class="frame-meta"><span class="frame-badge">OK</span> <span>${e.ts}</span> <span title="${e.u}">${shortName(e.u)}</span> <span>${e.b} ${t('bytes')}</span></div>
      <div class="frame-body">${e.p ? escHtml(e.txt) : formatHex(e.h)}</div>
    </div>`).join('');
}

function clearAllData() { logEntries = []; assembledEntries = []; renderLog(); renderFrames(); }

function hexToText(h) { try { return new TextDecoder().decode(new Uint8Array(h.match(/.{1,2}/g)?.map(b=>parseInt(b,16))||[])); } catch { return ''; } }
function isPrintable(s) { return s.length > 0 && /^[\x20-\x7E\u4e00-\u9fff\u00a0-\u00ff\n\r\t]+$/.test(s); }
function formatHex(h) { return h.match(/.{1,2}/g)?.join(' ').toUpperCase() || h.toUpperCase(); }
function shortName(u) { return u.endsWith('-0000-1000-8000-00805f9b34fb') ? `0x${u.slice(4,8).toUpperCase()}` : u.slice(0,8)+'...'; }
	function escHtml(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function showToast(msg, type = 'info') {
  const cont = document.getElementById('toastContainer');
  const el = document.createElement('div');
  const icon = type === 'error' ? '⚠️' : type === 'success' ? '✅' : '💡';
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icon}</span><span>${escHtml(msg)}</span>`;
  cont.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

(function init() { setTheme(currentTheme); setLang(currentLang); })();
</script>
</body>
</html>
